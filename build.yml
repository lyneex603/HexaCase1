name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -o HexaCase-project.zip -d build
      - run: mvn -B -f build/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: HexaCase
          path: build/target/HexaCase-*.jar
